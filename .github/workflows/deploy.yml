name: Deploy site

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .  # ensures bundle runs in the repo root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate AI atlas content
        run: node ai-map/validate.mjs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick libmagickwand-dev python3 pkg-config

      - name: Use available prebuilt Ruby gems
        run: bundle config set force_ruby_platform false

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3 --verbose

      - name: Build site
        run: JEKYLL_ENV=production bundle exec jekyll build --trace

      - name: Verify AI atlas output
        run: |
          test -s _site/ai-map/index.html
          test -s _site/ai-map/app.js
          test -s _site/ai-map/model.js
          test -s _site/ai-map/content.json
          test -s _site/ai-map/progress.json
          test -s _site/ai-map/lib/d3.v7.9.0.min.js
          test -s _site/ai-map/lib/D3-LICENSE.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
